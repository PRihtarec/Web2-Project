<!DOCTYPE html>
<html lang="hr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uplata listića</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f7f7f7;
      color: #222;
    }

    label {
      display: block;
      margin-top: 20px;
      font-weight: 600;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 6px;
    }

    button {
      margin-top: 20px;
      background: #007bff;
      color: #fff;
      border: none;
      padding: 10px 14px;
      border-radius: 6px;
      cursor: pointer;
    }

    #qr-container img {
      max-width: 220px;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      color: #007bff;
      text-decoration: none;
    }

    .error {
      margin-top: 20px;
      color: #a00;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Uplati listić</h1>


    <form id="bet-form">
      <label for="card_number">Osobna iskaznica / putovnica (1-20 spojenih znamenki)</label>
      <input id="card_number" type="text" maxlength="20" required>

      <label for="numbers">Brojevi (6–10 jedinstvenih brojeva u rasponu 1-45 odvojenih zarezom)</label>
      <input id="numbers" type="text" required>

      <button id="submit-btn" type="submit">Uplati listić</button>
      <div id="message"></div>
    </form>

    <div id="qr-container" hidden>
      <h3>QR kod listića</h3>
      <img id="qr-image" alt="QR kod listića">
    </div>

    <a href="/">Nazad na početnu stranicu</a>
  </div>

  <script src="/bet.js"></script>
</body>

</html>
